      "1/4 tsp paprika, optional",

        "@type": "HowToStep",

      {
        "@type": "HowToStep",
        "name": "Rest wrapped",
        "text": "Remove the turkey from the Ninja Foodi Grill. Leave it wrapped and rest at room temperature for 15 to 20 minutes so the juices settle and the center evens out."
      },
      {
        "@type": "HowToStep",
        "name": "Chill completely",
        "text": "Place the wrapped turkey in the refrigerator. Chill at least 4 hours, preferably overnight. Do not slice hot if the goal is lunch meat."
      },

        "@type": "HowToStep",

        "text": "Unwrap the chilled turkey and slice thinly across the grain. Use for sandwiches, wraps, salads, crackers, or protein plates."
